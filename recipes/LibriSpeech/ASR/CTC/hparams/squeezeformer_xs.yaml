# ############################################################################
# Model: E2E ASR with CTC
# Encoder: Squeezeformer XS Encoder
# Decoder: CTC beam searcher and greedy searcher
# Tokens: unigram
# Training: Librispeech 960h
# Authors: Titouan Parcollet, Shucong Zhang, Adel Moumen, Runze Wang
# ############################################################################
# Seed needs to be set at top of yaml, before objects with parameters are made

seed: 3402
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]
output_folder: !ref results/squeezeformer_ctc/
wer_file: !ref <output_folder>/wer.txt
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

# Data files
data_folder: !PLACEHOLDER  # e.g., /path/to/LibriSpeech
train_splits: ["train-clean-100", "train-clean-360", "train-other-500"]
dev_splits: ["dev-clean"]
test_splits: ["dev-clean", "test-clean", "test-other"]
select_n_sentences: None
skip_prep: False
train_csv: !ref <output_folder>/train.csv
valid_csv: !ref <output_folder>/dev-clean.csv
test_csv:
    - !ref <output_folder>/dev-clean.csv
    - !ref <output_folder>/test-clean.csv
    - !ref <output_folder>/test-other.csv

####################### Training Parameters ####################################

number_of_epochs: 500
batch_size: 16 # Batch_size 16 works for 2x GPUs with 32GB mem;
grad_accumulation_factor: 2
max_grad_norm: 5.0
sorting: descending #random
precision: fp32
num_workers: 8
loss_reduction: batchmean
valid_search_interval: 1
avg_checkpoints: 10 # Number of checkpoints to average for evaluation

lr_model: 2e-3 
n_warmup_steps: 3580
n_keep_steps: 32220

weight_decay: 0.0005

# Feature parameters
sample_rate: 16000
n_fft: 512
n_mels: 80
win_length: 25

# Enable Augmentation Flags
enable_speed_perturb: True
enable_drop_freq: True
enable_drop_chunk: True

# Training parameters
# To make Transformers converge, the global batch size should be large enough.
# The global batch size is max_batch_len * n_gpus * gradient_accumulation.
# Empirically, we used 850 * 8 A40 45G GPUs * 2 or 1700 * 4 A100 80G * 2.
# Please, set your parameters accordingly.
dynamic_batching: True
max_batch_length_train: 800 # max aggregated length of all examples in a batch. As high as possible without OOM errors.
max_batch_len_val: 100
num_bucket: 30 # lower number -> better randomization. Higher number -> faster training
shuffle: False # if true re-creates batches at each epoch shuffling examples.
max_batch_ex: 128
batch_ordering: descending

dynamic_batch_sampler_train:
    max_batch_length: !ref <max_batch_length_train>
    num_buckets: !ref <num_bucket>
    shuffle: !ref <shuffle>
    batch_ordering: !ref <batch_ordering>
    max_batch_ex: !ref <max_batch_ex>

dynamic_batch_sampler_val:
    max_batch_length: !ref <max_batch_len_val>
    num_buckets: !ref <num_bucket>
    shuffle: !ref <shuffle>
    batch_ordering: !ref <batch_ordering>
    max_batch_ex: !ref <max_batch_ex>

# Dataloader options
train_dataloader_opts:
    batch_size: !ref <batch_size>
    shuffle: True
    num_workers: !ref <num_workers>

valid_dataloader_opts:
    batch_size: 1

test_dataloader_opts:
    batch_size: 1

####################### Model Parameters #######################################

# Squeezeformer
input_dim: 80
encoder_dim: 144
num_layers: 16
reduce_layer_index: 7
recover_layer_index: 15
num_attention_heads: 4
feed_forward_expansion_factor: 4
conv_expansion_factor: 2
input_dropout_p: 0.1
feed_forward_dropout_p: 0.1
attention_dropout_p: 0.1
conv_dropout_p: 0.1
conv_kernel_size: 31
output_neurons: 128

# Outputs
token_type: unigram  # ["unigram", "bpe", "char"]
character_coverage: 1.0
blank_index: 0
bos_index: 1
eos_index: 2

# Decoding parameters
beam_size: 100
beam_prune_logp: -12.0
token_prune_min_logp: -1.2
prune_history: False

############################## models ################################

Squeezeformer: !new:Squeezeformer.Squeezeformer
    input_dim: !ref <input_dim>
    encoder_dim: !ref <encoder_dim>
    num_layers: !ref <num_layers>
    reduce_layer_index: !ref <reduce_layer_index>
    recover_layer_index: !ref <recover_layer_index>
    num_attention_heads: !ref <num_attention_heads>
    feed_forward_expansion_factor: !ref <feed_forward_expansion_factor>
    conv_expansion_factor: !ref <conv_expansion_factor>
    input_dropout_p: !ref <input_dropout_p>
    feed_forward_dropout_p: !ref <feed_forward_dropout_p>
    attention_dropout_p: !ref <attention_dropout_p>
    conv_dropout_p: !ref <conv_dropout_p>
    conv_kernel_size: !ref <conv_kernel_size>

ctc_lin: !new:speechbrain.nnet.linear.Linear
    input_size: !ref <encoder_dim>
    n_neurons: !ref <output_neurons>

normalize: !new:speechbrain.processing.features.InputNormalization
    norm_type: global
    update_until_epoch: 4

modules:
    Squeezeformer: !ref <Squeezeformer>
    ctc_lin: !ref <ctc_lin>
    normalize: !ref <normalize>

model: !new:torch.nn.ModuleList
    - [!ref <Squeezeformer>, !ref <ctc_lin>]

####################### Decoding & optimiser ###########################

# Decoding parameters
test_beam_search:
    blank_index: !ref <blank_index>
    beam_size: !ref <beam_size>
    beam_prune_logp: !ref <beam_prune_logp>
    token_prune_min_logp: !ref <token_prune_min_logp>
    prune_history: !ref <prune_history>

ctc_cost: !name:speechbrain.nnet.losses.ctc_loss
    blank_index: !ref <blank_index>
    reduction: !ref <loss_reduction>

noam_annealing: !new:speechbrain.nnet.schedulers.LinearNoamScheduler
    lr_initial: !ref <lr_model>
    n_warmup_steps: !ref <n_warmup_steps>
    n_keep_steps: !ref <n_keep_steps>

model_opt_class: !name:torch.optim.AdamW
    lr: !ref <lr_model>
    betas: (0.9, 0.98)
    eps: 0.000000001
    weight_decay: !ref <weight_decay>

log_softmax: !new:torch.nn.LogSoftmax
    dim: -1

############################## Augmentations ###################################

speed_perturb: !new:speechbrain.augment.time_domain.SpeedPerturb
    orig_freq: !ref <sample_rate>
    speeds: [95, 100, 105]

drop_freq: !new:speechbrain.augment.time_domain.DropFreq
    drop_freq_low: 0
    drop_freq_high: 1
    drop_freq_count_low: 1
    drop_freq_count_high: 3
    drop_freq_width: 0.05

drop_chunk: !new:speechbrain.augment.time_domain.DropChunk
    drop_length_low: 1000
    drop_length_high: 2000
    drop_count_low: 1
    drop_count_high: 5

# Augmenter: Combines previously defined augmentations to perform data augmentation
wav_augment: !new:speechbrain.augment.augmenter.Augmenter
    parallel_augment: False
    concat_original: True
    repeat_augment: 1
    shuffle_augmentations: False
    min_augmentations: 4
    max_augmentations: 4
    augment_prob: 1.0
    augmentations: [
        !ref <speed_perturb>,
        !ref <drop_freq>,
        !ref <drop_chunk>
    ]
    enable_augmentations: [
        !ref <enable_speed_perturb>,
        !ref <enable_drop_freq>,
        !ref <enable_drop_chunk>
    ]

compute_features: !new:speechbrain.lobes.features.Fbank
    sample_rate: !ref <sample_rate>
    n_fft: !ref <n_fft>
    win_length: !ref <win_length>
    n_mels: !ref <n_mels>

############################## Logging and Pretrainer ##########################

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        model: !ref <model>
        noam_scheduler: !ref <noam_annealing>
        normalizer: !ref <normalize>
        counter: !ref <epoch_counter>

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

cer_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
    split_tokens: True
wer_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
